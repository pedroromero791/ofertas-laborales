name: Actualizar ofertas de empleo

on:
  workflow_dispatch:
  schedule:
    # Diario a las 13:17 UTC (08:17 en Perú). GitHub puede retrasar la ejecución.
    - cron: '17 13 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-empleos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Descubrir enlaces de empleo por RSS público
        run: python scripts/update_jobs.py
      - name: Guardar cambios en jobs.json
        run: |
          if git diff --quiet -- jobs.json; then
            echo "No hay cambios en jobs.json."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jobs.json
            git commit -m "Actualización automática de ofertas"
            git push
          fi
