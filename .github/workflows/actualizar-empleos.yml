name: Actualizar ofertas de empleo

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-empleos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar Jooble y actualizar ofertas
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python scripts/update_jobs.py
      - name: Guardar cambios
        run: |
          if git diff --quiet -- jobs.json; then
            echo "No hay cambios en las ofertas."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jobs.json
            git commit -m "Actualizar ofertas desde Jooble"
            git push
          fi
